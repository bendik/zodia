[package]
name = "gen_baseline"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Generate baseline_aspects.toml via a local Ollama model"
publish = false

[[bin]]
name = "gen_baseline"
path = "src/main.rs"

[dependencies]
zodia-core.workspace = true
toml.workspace = true
serde = { workspace = true }
ureq = { version = "2", features = ["json"] }
serde_json = "1"
