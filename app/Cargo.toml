[package]
name = "zodia-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Relm4 + GTK4 frontend for Zodia"

[[bin]]
name = "zodia"
path = "src/main.rs"

[dependencies]
zodia-core.workspace = true
zodia-net.workspace = true
zodia-crypto.workspace = true
zodia-config.workspace = true
zodia-store.workspace = true
zodia-av.workspace = true
zodia-ops.workspace = true
zodia-pipeline.workspace = true
zodia-doc.workspace = true
zodia-sdk.workspace = true
zodia-llm.workspace = true
p2panda-core = "0.7"
ciborium.workspace = true
blake3.workspace = true
relm4 = { version = "0.10", features = ["macros", "libadwaita", "gnome_45"] }
gtk4 = "0.10"
libadwaita = { version = "0.8", features = ["v1_9"] }
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gio = "0.21"
hex = "0.4"
tzf-rs = "0.4"
chrono = "0.4"
chrono-tz = "0.10"

[dev-dependencies]
cucumber = "0.23.0"
tempfile = "3"

[[test]]
name = "screenshots"
harness = false

[[test]]
name = "sky_reading_persistence"
harness = false

[build-dependencies]
glib-build-tools = "0.21"
