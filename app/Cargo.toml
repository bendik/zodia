[package]
name = "zodia-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Relm4 + GTK4 frontend for Zodia"

[[bin]]
name = "zodia"
path = "src/main.rs"

[dependencies]
zodia-core.workspace = true
zodia-net.workspace = true
zodia-crypto.workspace = true
zodia-config.workspace = true
zodia-store.workspace = true
zodia-av.workspace = true
zodia-sync.workspace = true
ciborium.workspace = true
blake3.workspace = true
relm4 = { version = "0.10", features = ["macros", "libadwaita"] }
gtk4 = "0.10"
libadwaita = { version = "0.8", features = ["v1_8"] }
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gio = "0.21"
hex = "0.4"
ureq = { version = "2", features = ["json"] }
tzf-rs = "0.4"
chrono = "0.4"
chrono-tz = "0.10"

[build-dependencies]
glib-build-tools = "0.21"
