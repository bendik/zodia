<?xml version="1.0" encoding="UTF-8"?>
<!-- Network offline / disconnected — pure fills. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- centre dot -->
  <circle cx="8" cy="13.5" r="1.5" fill="currentColor"/>
  <!-- outer arc wedge (same as wireless but partial — faded by using a smaller wedge) -->
  <path fill="currentColor" fill-rule="evenodd"
    d="M 1.5 7.2 A 9 9 0 0 1 14.5 7.2
       L 12.8 8.9 A 6.5 6.5 0 0 0 3.2 8.9 Z"/>
  <!-- X cross overlay -->
  <rect x="6.8" y="3.5" width="2" height="8" rx="1" fill="currentColor"
        transform="rotate(45 8 7.5)"/>
  <rect x="6.8" y="3.5" width="2" height="8" rx="1" fill="currentColor"
        transform="rotate(-45 8 7.5)"/>
</svg>
