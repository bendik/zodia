<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 128 128" width="128" height="128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="42%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#22174a"/>
      <stop offset="100%" stop-color="#08060f"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <circle cx="64" cy="64" r="64" fill="url(#bg)"/>

  <!-- outer wheel ring -->
  <circle cx="64" cy="64" r="56" fill="none" stroke="#c9a84c" stroke-width="1.5"/>
  <!-- inner wheel ring -->
  <circle cx="64" cy="64" r="34" fill="none" stroke="#c9a84c" stroke-width="1"/>

  <!-- 12 house division lines, clockwise from top (outer ring → inner ring)
       outer r=56, inner r=34, center=(64,64)
       x = 64 + r*sin(θ),  y = 64 - r*cos(θ)  -->
  <!-- 0°  --> <line x1="64"    y1="8"     x2="64"    y2="30"    stroke="#c9a84c" stroke-width="1" opacity="0.65"/>
  <!-- 30° --> <line x1="92"    y1="15.5"  x2="81"    y2="34.6"  stroke="#c9a84c" stroke-width="1" opacity="0.65"/>
  <!-- 60° --> <line x1="112.5" y1="36"    x2="93.4"  y2="47"    stroke="#c9a84c" stroke-width="1" opacity="0.65"/>
  <!-- 90° --> <line x1="120"   y1="64"    x2="98"    y2="64"    stroke="#c9a84c" stroke-width="1" opacity="0.65"/>
  <!-- 120°--> <line x1="112.5" y1="92"    x2="93.4"  y2="81"    stroke="#c9a84c" stroke-width="1" opacity="0.65"/>
  <!-- 150°--> <line x1="92"    y1="112.5" x2="81"    y2="93.4"  stroke="#c9a84c" stroke-width="1" opacity="0.65"/>
  <!-- 180°--> <line x1="64"    y1="120"   x2="64"    y2="98"    stroke="#c9a84c" stroke-width="1" opacity="0.65"/>
  <!-- 210°--> <line x1="36"    y1="112.5" x2="47"    y2="93.4"  stroke="#c9a84c" stroke-width="1" opacity="0.65"/>
  <!-- 240°--> <line x1="15.5"  y1="92"    x2="34.6"  y2="81"    stroke="#c9a84c" stroke-width="1" opacity="0.65"/>
  <!-- 270°--> <line x1="8"     y1="64"    x2="30"    y2="64"    stroke="#c9a84c" stroke-width="1" opacity="0.65"/>
  <!-- 300°--> <line x1="15.5"  y1="36"    x2="34.6"  y2="47"    stroke="#c9a84c" stroke-width="1" opacity="0.65"/>
  <!-- 330°--> <line x1="36"    y1="15.5"  x2="47"    y2="34.6"  stroke="#c9a84c" stroke-width="1" opacity="0.65"/>

  <!-- AC/DC and IC/MC axis lines (faint) -->
  <line x1="8"  y1="64" x2="120" y2="64"  stroke="#c9a84c" stroke-width="0.5" opacity="0.20"/>
  <line x1="64" y1="8"  x2="64"  y2="120" stroke="#c9a84c" stroke-width="0.5" opacity="0.20"/>

  <!-- aspect lines between planets (decorative, drawn before dots so dots sit on top) -->
  <!-- Sun–Jupiter line -->
  <line x1="95.8" y1="32.2" x2="92.9" y2="98.5" stroke="#5090d0" stroke-width="1" opacity="0.40"/>
  <!-- Moon–Mars line -->
  <line x1="48.6" y1="106.3" x2="29.5" y2="35.1" stroke="#d07050" stroke-width="1" opacity="0.35"/>

  <!-- planetary dots at r=45, clockwise-from-top angles -->
  <!-- Sun (gold)        θ=45°  → (95.8, 32.2) -->
  <circle cx="95.8"  cy="32.2"  r="4.5" fill="#f5c030"/>
  <!-- Moon (silver-blue) θ=200° → (48.6, 106.3) -->
  <circle cx="48.6"  cy="106.3" r="3.5" fill="#c8d8f0"/>
  <!-- Mars (red)        θ=310° → (29.5, 35.1) -->
  <circle cx="29.5"  cy="35.1"  r="3.0" fill="#e04428"/>
  <!-- Jupiter (violet)  θ=140° → (92.9, 98.5) -->
  <circle cx="92.9"  cy="98.5"  r="3.0" fill="#7060c8"/>

  <!-- chart centre point -->
  <circle cx="64" cy="64" r="2.5" fill="#c9a84c" opacity="0.9"/>
</svg>
