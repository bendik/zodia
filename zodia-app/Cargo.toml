[package]
name = "zodia-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Relm4 + GTK4 frontend for Zodia"

[[bin]]
name = "zodia"
path = "src/main.rs"

[dependencies]
zodia-core.workspace = true
zodia-net.workspace = true
zodia-crypto.workspace = true
zodia-config.workspace = true
zodia-store.workspace = true
zodia-av.workspace = true
blake3.workspace = true
relm4 = { version = "0.9", features = ["macros"] }
gtk4 = "0.9"
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
