<?xml version="1.0" encoding="UTF-8"?>
<!-- Sun icon — pure fills so GTK symbolic recoloring works on all platforms. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- centre disc -->
  <circle cx="8" cy="8" r="3" fill="currentColor"/>
  <!-- 8 rays as thin filled rectangles, each rotated around the centre -->
  <rect x="7.25" y="0.5" width="1.5" height="2.75" rx="0.75" fill="currentColor"
        transform="rotate(  0 8 8)"/>
  <rect x="7.25" y="0.5" width="1.5" height="2.75" rx="0.75" fill="currentColor"
        transform="rotate( 45 8 8)"/>
  <rect x="7.25" y="0.5" width="1.5" height="2.75" rx="0.75" fill="currentColor"
        transform="rotate( 90 8 8)"/>
  <rect x="7.25" y="0.5" width="1.5" height="2.75" rx="0.75" fill="currentColor"
        transform="rotate(135 8 8)"/>
  <rect x="7.25" y="0.5" width="1.5" height="2.75" rx="0.75" fill="currentColor"
        transform="rotate(180 8 8)"/>
  <rect x="7.25" y="0.5" width="1.5" height="2.75" rx="0.75" fill="currentColor"
        transform="rotate(225 8 8)"/>
  <rect x="7.25" y="0.5" width="1.5" height="2.75" rx="0.75" fill="currentColor"
        transform="rotate(270 8 8)"/>
  <rect x="7.25" y="0.5" width="1.5" height="2.75" rx="0.75" fill="currentColor"
        transform="rotate(315 8 8)"/>
</svg>
